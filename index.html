<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Custom Umbrella</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app" data-color="blue">
    <section class="customizer" aria-label="Custom Umbrella">
      <div class="preview">
        <div class="umbrella-stage">
          <img id="umbrellaImage"
               class="umbrella-image"
               src="assets/Blue umbrella.png"
               alt="Blue umbrella">
          <img id="logoPreview"
               class="logo"
               alt="Uploaded company logo"
               hidden>
          <img id="loader"
               class="loader"
               src="assets/loader_icon.svg"
               alt=""
               aria-hidden="true">
        </div>
      </div>

      <div class="controls">
        <h1>Custom Umbrella</h1>

        <div class="swatches" role="group" aria-label="Umbrella color">
          <button class="swatch" data-color="pink" aria-label="Pink" aria-pressed="false"></button>
          <button class="swatch is-active" data-color="blue" aria-label="Blue" aria-pressed="true"></button>
          <button class="swatch" data-color="yellow" aria-label="Yellow" aria-pressed="false"></button>
        </div>

        <div class="copy">
          <h2>Customize your umbrella</h2>
          <p>Upload a logo for an instant preview.</p>
          <small>.png and .jpg files only. Max file size is 5MB.</small>
        </div>

        <label class="upload" for="logoInput">
          <span class="upload-icon">
            <img src="assets/upload_icon.svg" alt="" aria-hidden="true">
          </span>
          <span class="upload-name" id="uploadName">UPLOAD LOGO</span>
          <button class="remove-logo" id="removeLogo" type="button"
                  aria-label="Remove uploaded logo" hidden>×</button>
          <input id="logoInput"
                 type="file"
                 accept=".png,.jpg,.jpeg,image/png,image/jpeg">
        </label>

        <p class="error" id="errorMessage" role="alert" aria-live="polite"></p>
      </div>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
